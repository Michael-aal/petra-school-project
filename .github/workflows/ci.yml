name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: petra
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d petra"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/petra?connection_limit=15&pool_timeout=30
      JWT_SECRET: ci-test-secret-with-at-least-32-characters
      CORS_ORIGIN: http://localhost:5173
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript compiler check
        run: npx tsc --noEmit
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Run database migrations
        run: npx prisma migrate deploy
      - name: Run database seed
        run: npx prisma db seed
      - name: Execute test suite
        run: npm test
