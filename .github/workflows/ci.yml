name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: petra
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d petra"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
